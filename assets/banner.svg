<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="card-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.8)"/>
    </linearGradient>

    <linearGradient id="card-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.15)"/>
      <stop offset="100%" stop-color="rgba(99, 102, 241, 0.1)"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="card-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.2"/>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 40px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 17px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #e2e8f0;
    }
    .mono-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      fill: #38bdf8;
    }

    /* Ambient Animated Orbs */
    @keyframes pulseOrb1 {
      0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.35; }
      50% { transform: translate(30px, -20px) scale(1.15); opacity: 0.6; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.25; }
      50% { transform: translate(-25px, 20px) scale(1.2); opacity: 0.5; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes flowGantt {
      0% { stroke-dashoffset: 80; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .orb-1 { animation: pulseOrb1 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb2 10s ease-in-out infinite; transform-origin: 1000px 220px; }
    .floating-card-1 { animation: floatCard1 5s ease-in-out infinite; }
    .floating-card-2 { animation: floatCard2 6s ease-in-out infinite; }
    .pulse-dot { animation: pulseDot 2s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bg-grad)"/>

  <!-- Grid overlay -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="220" x2="1200" y2="220"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="150" y1="0" x2="150" y2="340"/>
    <line x1="300" y1="0" x2="300" y2="340"/>
    <line x1="450" y1="0" x2="450" y2="340"/>
    <line x1="600" y1="0" x2="600" y2="340"/>
    <line x1="750" y1="0" x2="750" y2="340"/>
    <line x1="900" y1="0" x2="900" y2="340"/>
    <line x1="1050" y1="0" x2="1050" y2="340"/>
  </g>

  <!-- Animated Ambient Orbs in Background -->
  <circle class="orb-1" cx="220" cy="90" r="130" fill="#38bdf8" filter="url(#glow)"/>
  <circle class="orb-2" cx="1020" cy="200" r="140" fill="#818cf8" filter="url(#glow)"/>
  <circle class="orb-1" cx="640" cy="280" r="90" fill="#c084fc" filter="url(#glow)" opacity="0.25"/>

  <!-- Floating Dynamic Tech Cards / Kanban Elements (Background Right & Bottom) -->
  <g class="floating-card-1" filter="url(#card-glow)">
    <!-- Kanban Mini Board / Card 1 -->
    <rect x="910" y="45" width="230" height="110" rx="10" fill="url(#card-grad1)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2"/>
    <rect x="925" y="60" width="8" height="8" rx="2" fill="#38bdf8"/>
    <text x="940" y="68" class="badge-text" fill="#38bdf8">IN PROGRESS • SPRINT 42</text>
    <rect x="925" y="80" width="180" height="6" rx="3" fill="rgba(255,255,255,0.15)"/>
    <rect x="925" y="94" width="120" height="6" rx="3" fill="rgba(255,255,255,0.1)"/>
    <rect x="925" y="115" width="65" height="22" rx="6" fill="#0284c7" opacity="0.7"/>
    <text x="935" y="130" class="mono-text" fill="#ffffff">#TeamSync</text>
    <circle cx="1115" cy="126" r="12" fill="#38bdf8" opacity="0.9"/>
    <text x="1110" y="130" font-family="sans-serif" font-size="11" fill="#0f172a" font-weight="bold">AI</text>
  </g>

  <g class="floating-card-2" filter="url(#card-glow)">
    <!-- Gantt / Timeline Mini Pill Card -->
    <rect x="850" y="180" width="290" height="110" rx="10" fill="url(#card-grad1)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.2"/>
    <rect x="865" y="195" width="8" height="8" rx="2" fill="#818cf8"/>
    <text x="880" y="203" class="badge-text" fill="#818cf8">TIMELINE &amp; RESOURCE ALLOCATION</text>
    <!-- Mini progress bars -->
    <rect x="865" y="220" width="160" height="10" rx="5" fill="#38bdf8" opacity="0.85"/>
    <rect x="1035" y="220" width="90" height="10" rx="5" fill="rgba(255,255,255,0.12)"/>
    <rect x="865" y="240" width="90" height="10" rx="5" fill="#a855f7" opacity="0.85"/>
    <rect x="965" y="240" width="160" height="10" rx="5" fill="rgba(255,255,255,0.12)"/>
    <rect x="865" y="260" width="210" height="10" rx="5" fill="#34d399" opacity="0.85"/>
  </g>

  <!-- Foreground Title and Content (Clear & High Contrast) -->
  <g transform="translate(60, 0)">
    <!-- Category Pill -->
    <g transform="translate(0, 48)">
      <rect width="260" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
      <circle cx="14" cy="14" r="5" fill="#38bdf8" class="pulse-dot"/>
      <text x="28" y="19" class="mono-text" fill="#38bdf8">CURATED OPEN SOURCE &amp; SAAS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="130" class="title-text">Awesome Task Scheduling</text>
    <text x="0" y="178" class="title-text" fill="url(#accent-cyan)">&amp; Team Planning 🚀</text>

    <!-- Subtitle -->
    <text x="0" y="222" class="subtitle-text">Master sprint planning, workload orchestration, and project workflows.</text>
    <text x="0" y="248" class="subtitle-text">Curated directory of SaaS powerhouses and self-hosted open-source tools.</text>

    <!-- Dynamic Flow Indicator Badges -->
    <g transform="translate(0, 275)">
      <!-- Pill 1 -->
      <rect width="110" height="28" rx="7" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
      <text x="14" y="18" class="badge-text">⚡ Kanban</text>

      <!-- Pill 2 -->
      <rect x="122" width="105" height="28" rx="7" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
      <text x="136" y="18" class="badge-text">📊 Gantt</text>

      <!-- Pill 3 -->
      <rect x="239" width="120" height="28" rx="7" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
      <text x="253" y="18" class="badge-text">🔁 CalDAV Sync</text>

      <!-- Pill 4 -->
      <rect x="371" width="130" height="28" rx="7" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
      <text x="385" y="18" class="badge-text">🛡️ Self-Hosted</text>

      <!-- Pill 5 -->
      <rect x="513" width="125" height="28" rx="7" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
      <text x="527" y="18" class="badge-text">🤖 AI Workflows</text>
    </g>
  </g>
</svg>
